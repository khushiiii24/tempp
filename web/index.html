  <body>
    <!--
      Core content for crawlers and for the no-JavaScript case. Both reference briefs call
      out the same failure: a site that renders as an empty div without scripts. The React
      root replaces this on mount.
    -->
    <div id="root">
      <noscript>
        <h1>Recoup</h1>
        <p>
          Indian buyers pay invoices net of deductions: tax withheld, rebates claimed, credit notes
          netted off, shortages docked. Recoup decides which of those you are actually owed back.
        </p>
        <p>
          Across a generated batch of 400 invoices, Rs 1,22,03,318 was short-paid. Rs 47,32,790 of
          that is genuinely recoverable; Rs 22,49,826 would actually be paid if chased correctly.
          Recoup handles Rs 21,78,552 of it — 2.3 times what writing to everyone handles — while sending
          20 letters about legitimate deductions instead of 473.
        </p>
        <p>
          Every deduction is classified by a local model, then verified against Form 26AS, the
          credit-note ledger, the contract, the scheme master and the goods-receipt log before any
          contact is made. Compliance is checked twice by two independent implementations, and
          every case replays from an append-only decision log alone.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
