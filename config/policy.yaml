# Everything tunable lives here. Nothing in this file may be hardcoded in Python.
# During a panel demo you should be able to change a number here, re-run, and watch the
# scoreboard move. All money is INTEGER PAISE.

economics:
  # What it costs the seller to make one contact on each channel.
  contact_cost_paise:
    email: 0
    whatsapp: 80          # Rs 0.80
    sms: 25
    call: 1500            # Rs 15 of an agent's time
    human_analyst: 30000  # Rs 300 — a queued case costs real analyst minutes

  write_off_threshold_paise: 50000          # Rs 500  — below this, never chase, just book it
  min_expected_value_to_chase_paise: 20000  # Rs 200  — EV floor for any intervention
  human_review_threshold_paise: 5000000     # Rs 50,000 — above this a human decides, always
  cn_approval_threshold_paise: 2000000      # Rs 20,000 — credit notes above this need sign-off

confidence:
  classify_floor: 0.72          # below this the classification is not acted on
  match_floor: 0.85             # below this an allocation is an exception, not a match
  abstain_to_human_below: 0.60  # below this we do not even attempt verification

compliance:
  contact_window_ist: {start: "09:30", end: "18:30"}
  contact_days: [mon, tue, wed, thu, fri]
  max_contacts_per_case: 4
  max_contacts_per_buyer_per_week: 3
  min_gap_hours: 72
  channel_ladder: [email, email, whatsapp, call]
  require_consent_for: [whatsapp, sms]
  respect_dnd: true
  forbidden_phrases:
    - "legal action"
    - "blacklist"
    - "we will report"
    - "immediately or else"
    - "police"
    - "recovery agent"
    - "default notice"
  escalation_ladder: [ap_clerk, ap_manager, procurement, account_manager]
  credit_hold_requires_human: true

stopping_rules:
  stop_on_dispute_raised: true
  stop_on_opt_out: true
  stop_on_promise_until_days_after: 3
  stop_when_expected_recovery_below_cost: true
  stop_after_max_contacts: true
  # Never chase a trivial amount from a very large account: Rs 1,000 owed by a Rs 2Cr
  # customer is not worth the relationship risk.
  #
  # The spec sets this to 200, which contradicts its own worked example — Rs 2Cr / Rs 1k is
  # a ratio of 20,000. Measured on this batch, 200 stops **58% of all chaseable
  # deductions** (median ratio 311), which is not "never chase small change from a big
  # account", it is "barely chase anything". At 20,000 it stops 6%, which is the case the
  # comment actually describes.
  #
  # Following the intent rather than the literal number, and saying so.
  stop_if_relationship_value_ratio_exceeds: 20000
  stop_on_verified_valid: true
  stop_on_human_takeover: true

settlement:
  # A split payment looks exactly like a short payment on day one. Without this the agent
  # chases invoices that were always going to be paid in full, and the false-chase number
  # — the metric the entire pitch rests on — is inflated by an artefact of the clock.
  treat_as_short_after_days: 7    # days past due before a delta becomes a chaseable case
  reopen_on_further_credit: true  # a later credit against the same invoice reduces the delta

verification:
  # 26AS lags by a quarter, so a legitimate TDS deduction may simply not be visible yet.
  # The correct behaviour is to provisionally close and flag for re-check — NOT to chase.
  tds_provisional_close_when_absent: true
  tds_recheck_after_days: 90
  # Tolerance when comparing a computed statutory amount to a deducted amount.
  amount_tolerance_paise: 100     # Rs 1 — absorbs the buyer's own off-by-a-rupee arithmetic

drafting:
  # The policy engine picks the template class, channel, recipient and timing.
  # The LLM only writes prose inside those bounds, and the validator polices it.
  allow_payment_link: false       # flipped on only for the Phase 7 Razorpay demo
  max_body_chars: 1400
  require_case_reference: true
